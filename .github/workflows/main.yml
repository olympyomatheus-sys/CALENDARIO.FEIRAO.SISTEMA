name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (heartbeat)
        run: |
          curl -X POST "https://zagdjwyjldahtowuvkrn.supabase.co/rest/v1/heartbeat" \
            -H "apikey: sb_publishable_T4UVdcg0y8OaaSwe0rPMmA_OpBpW4eJ" \
            -H "Authorization: Bearer sb_publishable_T4UVdcg0y8OaaSwe0rPMmA_OpBpW4eJ" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d '{"id": "ping", "updated_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' \
            --fail --silent --show-error
